name: Unity source checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/requirements.txt
      - name: Install Python validation dependencies
        run: python -m pip install -r Tools/requirements.txt
      - name: Install Mono compiler and runtime
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-mcs
      - name: Run all offline checks and collect individual results
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python Tools/run_source_checks.py --report-dir /tmp/alcatraz-checks
      - name: Publish check summary
        if: always()
        run: |
          if [ -f /tmp/alcatraz-checks/summary.md ]; then
            cat /tmp/alcatraz-checks/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload check reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/alcatraz-checks
          if-no-files-found: warn
          retention-days: 14
