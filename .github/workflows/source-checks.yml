name: Unity source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/requirements.txt
      - run: pip install -r Tools/requirements.txt
      - name: Execute poker and weapon rule tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-mcs
          mcs -out:/tmp/HoldemTests.exe Assets/Game/Scripts/Activities/PrisonPokerRules.cs Assets/Game/Scripts/Activities/HoldemGame.cs Assets/Game/Foundation/Scripts/WeaponState.cs Tools/Tests/HoldemTests.cs
          mono /tmp/HoldemTests.exe
          mcs -out:/tmp/VehicleControlTests.exe Assets/Game/Foundation/Scripts/VehicleControlRules.cs Tools/Tests/VehicleControlTests.cs
          mono /tmp/VehicleControlTests.exe
          mcs -out:/tmp/CombatTests.exe Assets/Game/Foundation/Scripts/WeaponState.cs Assets/Game/Foundation/Scripts/CombatHealth.cs Tools/Tests/CombatTests.cs
          mono /tmp/CombatTests.exe
          mcs -out:/tmp/MenuCheckpointTests.exe Assets/Game/Foundation/Scripts/WeaponState.cs Assets/Game/Scripts/Save/CheckpointStorage.cs Tools/Tests/MenuCheckpointTests.cs
          mono /tmp/MenuCheckpointTests.exe
          mcs -out:/tmp/CameraFramingTests.exe Assets/Game/Foundation/Scripts/CameraFramingRules.cs Tools/Tests/CameraFramingTests.cs
          mono /tmp/CameraFramingTests.exe
      - name: Check C# grammar
        run: python Tools/check_csharp_syntax.py
      - name: Check character forward axis and source gait
        run: python Tools/validate_character_forward.py
      - name: Check scene bindings and supported routes
        run: python Tools/validate_alcatraz.py
      - name: Check native asset integrity
        run: python Tools/validate_project.py
      - name: Check supplied asset dependencies and island floor samples
        run: python Tools/validate_supplied_assets.py
      - name: Check connected prison interior and supported routes
        run: python Tools/validate_supplied_prison.py
      - name: Check warehouse door floor support and barrel assets
        run: python Tools/validate_warehouse.py
      - name: Check all native extras and their runtime registration
        run: python Tools/validate_extra_assets.py
      - name: Check police source detail and helicopter glass
        run: python Tools/validate_police_helicopter.py
