<!doctype html><meta charset="utf-8"><title>Alcatraz — all menu sections / offline layout</title>
<style>
@font-face{font-family:Anton;src:url(../Assets/Game/Resources/BlackstoneFoundation/Menu/Heading.ttf)}*{box-sizing:border-box}body{margin:0;background:black;color:#ede8d9;font-family:Arial,sans-serif}.canvas{position:absolute;width:1920px;height:1080px;transform-origin:top left;background:url(../Assets/Game/Resources/BlackstoneFoundation/Menu/Background.png) center/cover}.sidebar{position:absolute;inset:0 auto 0 0;width:590px;background:#040506d1;border-right:2px solid #d4ad6359}.shade{position:absolute;inset:0 0 0 590px;background:#0305064d}.caption{position:absolute;color:#d4ad63;font-size:16px;letter-spacing:1px}.title{position:absolute;left:94px;top:110px;width:460px;font:78px/82px Anton}.rule{position:absolute;height:1px;background:#d4ad63}.nav{position:absolute;left:95px;width:460px;height:55px;background:#091015e6;border:1px solid #88888059;color:#ede8d9;text-align:left;font:bold 20px Arial;cursor:pointer}.nav.selected{background:#850b0bf0;border:2px solid #d4ad63;box-shadow:0 0 9px #d4ad6355}.nav img{position:absolute;left:25px;top:10px;width:34px;height:34px}.number{position:absolute;left:91px;top:15px;color:#d4ad63;font-size:22px;font-weight:normal}.label{position:absolute;left:149px;top:17px;white-space:nowrap}.arrow{position:absolute;right:12px;top:11px;font-size:30px;color:#d4ad63}.panel{position:absolute;left:615px;top:160px;width:1265px;height:810px;background:#040607e0}.hero{position:absolute;left:665px;top:205px;font:62px/95px Anton;text-transform:uppercase}.card{position:absolute;background:#0e1112f2;border-left:3px solid #d4ad6399;padding:20px 24px}.card h3{margin:0;color:#d4ad63;font-size:16px;font-weight:normal;text-transform:uppercase}.card p{margin:25px 0 0;font-size:24px;line-height:31px;white-space:pre-line}.plain{position:absolute;font-size:24px;line-height:32px}.action{background:#12171ae6;border:1px solid #88888059;color:#ede8d9;text-align:left;padding:15px 22px;font:24px Arial;cursor:pointer}.action:hover{border-color:#d4ad63;background:#473013d4}.disabled{opacity:.4}.stat{position:absolute;left:1085px;width:740px;color:#d4ad63;font-size:16px;text-transform:uppercase}.stat .value{float:right;color:#ede8d9;font-size:24px}.bar{margin-top:22px;height:9px;background:#394040}.bar div{height:9px;background:#d4ad63}.weapons{position:absolute;left:665px;top:365px;width:1160px;height:460px;overflow-y:auto;display:grid;grid-template-columns:540px 540px;grid-auto-rows:120px;gap:15px 20px}.weapon{white-space:pre-line;line-height:31px}.footer{position:absolute;left:665px;top:1008px;color:#d4ad63;font-size:16px}.notice{position:absolute;bottom:7px;right:18px;color:#ded5c1;font-size:12px;background:#0009;padding:4px}.toast{position:absolute;left:665px;top:943px;font-size:18px}.setting{position:absolute;left:665px;width:1160px;height:42px;font-size:24px}.setting input{position:absolute;left:370px;top:12px;width:665px;accent-color:#d4ad63}.setting output{position:absolute;right:0;font-size:18px;top:7px}.setting select{position:absolute;left:370px;width:790px;height:42px;background:#172024;color:#ede8d9;font-size:20px}.slot-action{position:absolute;left:1530px;width:270px;height:56px}.card .dim{opacity:.6}
</style>
<div class="canvas"><div class="sidebar"></div><div class="shade"></div><div class="caption" style="left:100px;top:54px">THE SILENT BLUEPRINT</div><div class="rule" style="left:100px;top:91px;width:450px"></div><div class="title">ALCATRAZ<br>ISLAND</div><div class="caption" style="left:100px;top:274px">SESSION PAUSED / EXPLORATION</div><div class="rule" style="left:100px;top:313px;width:450px;opacity:.65"></div><div id="nav"></div><div class="caption" style="right:55px;top:54px">ALCATRAZ / CHAPTER 01</div><div class="panel"></div><div class="caption" style="left:665px;top:165px">THE PRISON ESCAPE / SESSION PAUSED</div><div class="hero" id="heading"></div><div class="rule" style="left:665px;top:315px;width:1160px;opacity:.5"></div><main id="content"></main><div class="toast" id="toast"></div><div class="footer">ESC / START: RESUME　 ↑ ↓: SECTION　 ← →: SLOT / WEAPON　 ENTER / A: SELECT</div><div class="caption" id="number" style="left:1770px;top:1008px"></div><div class="caption" style="left:100px;top:998px">ELIAS VALE · INMATE B-04</div><div class="rule" style="left:100px;top:1027px;width:450px"></div><div class="notice">OFFLINE LAYOUT / INITIAL EXPLORATION EXAMPLE — NOT UNITY GAMEPLAY</div></div>
<script>
const sections=["Map", "Mission", "Inventory", "Character", "Weapons", "Journal", "Settings", "Save Game", "Load Game", "Exit to Main Menu"],asset='../Assets/Game/Resources/BlackstoneFoundation/Menu/';
const icons=['map','book','cards','inmate','cards','book','settings','book','book','exit'];
let current=0;
const card=(x,y,w,h,title,text)=>`<article class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><h3>${title}</h3><p>${text}</p></article>`;
const plain=(x,y,w,text)=>`<div class="plain" style="left:${x}px;top:${y}px;width:${w}px">${text}</div>`;
const action=(x,y,w,h,text,disabled=false)=>`<button class="action ${disabled?'disabled':''}" ${disabled?'disabled':''} style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px" onclick="toast()">${text}</button>`;
function toast(){document.querySelector('#toast').textContent='Layout preview only — game actions run in Unity.'}
function stat(y,title,value){return `<div class="stat" style="top:${y}px">${title}<span class="value">${value} / 100</span><div class="bar"><div style="width:${value}%"></div></div></div>`}
function page(i){
 if(i===0)return plain(665,338,1160,'Explore the prison, docks, helipad and connected annex.')+`<img style="position:absolute;left:665px;top:390px;width:795px;height:530px" src="../Assets/Game/Supplied/Resources/AlcatrazSupplied/Island/Minimap.png">`+card(1495,390,330,260,'Current zone','Alcatraz Island\nWhite: Elias\nGold: cellhouse\nH: helipad\nD: coastal house');
 if(i===1)return card(665,365,750,260,'Active mission','Find the cellhouse entrance. Explore the island and its connected activities.')+card(1450,365,375,260,'Mission status','EXPLORATION\n\nChapter progress begins in Chapter 01.')+card(665,665,1160,230,'Chapter progression','Meet the inmates / Earn the gang’s trust\nObtain a phone / Face the rival gang\nSurvive isolation / Plan the escape');
 if(i===2){const items=[['Prison ID','B-04 / Elias Vale'],['Cell key','Not acquired'],['Phone','Not acquired'],['Hidden knife','Available in equipment'],['Gang tattoo','Not acquired'],['Uniform','Prison work uniform']];return items.map((a,n)=>card(665+n%3*395,365+Math.floor(n/3)*255,370,230,a[0],'')+`<img style="position:absolute;left:${689+n%3*395}px;top:${443+Math.floor(n/3)*255}px;width:68px;height:68px" src="${asset+['id','key','phone','knife','tattoo','uniform'][n]}.png">`+plain(780+n%3*395,443+Math.floor(n/3)*255,230,a[1])).join('')}
 if(i===3)return card(665,365,385,515,'Prisoner record','ELIAS VALE\nINMATE B-04')+`<img style="position:absolute;left:760px;top:525px;width:195px;height:195px" src="${asset}inmate.png">`+plain(689,760,335,'Status: incarcerated<br>Island exploration')+stat(365,'Health',100)+stat(470,'Stamina',100)+stat(575,'Gang respect',0)+card(1085,685,740,195,'Contacts / combat','Chapter not started\nSuccessful combat hits: 0');
 if(i===4){let names=['Unarmed','Knife','Pistol','Rifle','Revolver','Machete','M9A3','PX4','PMX','BRX1','ColtM5'],ammo=['','', '15 + 75','30 + 120','6 + 36','','17 + 68','17 + 68','30 + 120','10 + 40','30 + 120'];return '<div class="weapons">'+names.map((n,j)=>`<button class="action weapon" onclick="toast()">${n.toUpperCase()}\n${j===0?'EQUIPPED':'AVAILABLE'}${ammo[j]?' / '+ammo[j]+' rounds':''}</button>`).join('')+'</div>'+plain(665,850,1160,'Selected: Unarmed. Use ← → and Enter, or click a card.')}
 if(i===5)return card(665,365,1160,155,'Island routes','The cellhouse, helipad and coastal dock can be reached from Island locations on the title screen.')+card(665,545,1160,155,'Connected annex','The workshop connects to a factory yard, warehouse and wooden carport.')+card(665,725,1160,155,'Chapter file','Story discoveries appear here after you begin Chapter 01.');
 if(i===6){let html='';let selects=[['Display mode',350,['FULLSCREEN','WINDOWED']],['Resolution',410,['1280 × 720','1920 × 1080','2560 × 1440']],['Graphics quality',470,['Desert High']]];for(const [label,y,values] of selects)html+=`<div class="setting" style="top:${y}px">${label}<select>${values.map(x=>'<option>'+x+'</option>').join('')}</select></div>`;for(const [label,y,v] of [['Master volume',530,80],['Sound effects',580,80],['Music',630,35],['Dialogue',680,90],['Camera sensitivity',730,40]])html+=`<div class="setting" style="top:${y}px">${label}<input type="range" min="0" max="100" value="${v}" oninput="this.nextElementSibling.value=this.value+'%'"><output>${v}%</output></div>`;return html+action(665,785,350,40,'Subtitles: ON')+action(1040,785,380,40,'Invert camera Y: OFF')+plain(1460,790,365,'Language: English')+action(665,835,1160,65,'Apply display & save settings')}
 if(i===7||i===8){let html=plain(665,338,1160,i===7?'Select a slot to save the current checkpoint.':'Resume a valid saved checkpoint.');for(let n=0;n<4;n++)html+=card(665,405+n*120,1160,100,n===0?'Autosave / latest checkpoint':'Manual slot '+String(n).padStart(2,'0'),'NO VALID SAVE DATA')+action(1530,427+n*120,270,56,i===7?'SAVE ›':'LOAD ›',i===8);return html+plain(665,902,1160,'Exploration checkpoints restore location and equipment; NPC/world state is not reset.')}
 return `<div class="hero" style="left:740px;top:420px;font-size:56px">LEAVE YOUR CURRENT SESSION?</div>`+plain(740,560,1010,'Your latest checkpoint remains available. Progress after that checkpoint may be lost.')+action(740,735,495,75,'Yes, return to title')+action(1270,735,495,75,'Cancel / stay');
}
function select(i){current=(i+10)%10;location.hash=current;document.querySelector('#heading').textContent=current===0?'ISLAND MAP':sections[current];document.querySelector('#number').textContent=String(current+1).padStart(2,'0')+' / 10';document.querySelector('#content').innerHTML=page(current);document.querySelector('#toast').textContent='';document.querySelector('#nav').innerHTML=sections.map((s,n)=>`<button class="nav ${n===current?'selected':''}" style="top:${330+n*63}px" onclick="select(${n})"><img src="${asset+icons[n]}.png"><span class="number">${String(n+1).padStart(2,'0')}</span><span class="label">${s.toUpperCase()}</span><span class="arrow">›</span></button>`).join('')}
function fit(){let s=Math.min(innerWidth/1920,innerHeight/1080),c=document.querySelector('.canvas');c.style.transform='scale('+s+')';c.style.left=(innerWidth-1920*s)/2+'px';c.style.top=(innerHeight-1080*s)/2+'px'}onresize=fit;onhashchange=()=>{let n=Number(location.hash.slice(1));if(n!==current)select(n)};onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();select(current+1)}if(e.key==='ArrowUp'){e.preventDefault();select(current-1)}};select(Number(location.hash.slice(1))||0);fit();
</script>
